<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>brand check</title>
<style>body{margin:0;background:#0D1B53;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:40px;color:white;font-family:sans-serif}.cell{text-align:center}.cell img{width:200px;height:200px;background:transparent}.cell.light img{background:#f8f5e9}.cell.dark img{background:#0D1B53}.lbl{margin-top:10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#D4AF37}</style></head>
<body>
  <div class="cell"><img src="logo-color.svg"><div class="lbl">Ana Logo</div></div>
  <div class="cell"><img src="logo-inverse.svg"><div class="lbl">Ters (Lacivert)</div></div>
  <div class="cell light"><img src="logo-mono.svg"><div class="lbl">Tek Renk</div></div>
  <div class="cell"><img src="icon-laurel.svg" style="width:200px;height:120px"><div class="lbl">Laurel</div></div>
  <div class="cell"><img src="icon-monogram.svg"><div class="lbl">Monogram</div></div>
  <div class="cell"><img src="icon-ribbon.svg" style="width:200px;height:60px"><div class="lbl">Kurdele</div></div>
</body></html>
